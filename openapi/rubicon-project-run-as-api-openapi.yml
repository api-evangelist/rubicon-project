openapi: 3.2.0
info:
  title: SpringServe UI Run As API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Run As
paths:
  /api/v1/run_as/available_users:
    get:
      summary: Available Users for Run As. Run in the context of the true user
      description: Lists the users that the current user can run as
      parameters:
      - name: search
        in: query
        description: Search term to filter users by email
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              example:
              - id: 1
                email: user1@example.com
                name: User One
              - id: 2
                email: user2@example.com
                name: User Two
              schema:
                type: object
      tags:
      - Run As
      operationId: run_as_available_users_get
  /api/v1/run_as/permission:
    get:
      summary: Can Run As User. Run in the context of the true user
      description: Check if the current user can run as another user
      responses:
        '200':
          description: ''
          content:
            application/json:
              example:
                can_run_as: true
              schema:
                type: object
      tags:
      - Run As
      operationId: run_as_permission_get
  /api/v1/run_as/start:
    post:
      summary: Run As User. Run in the context of the true user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
            examples:
              internal_user:
                $ref: '#/components/examples/run_as_start_internal_user'
              external_user:
                $ref: '#/components/examples/run_as_start_external_user'
        required: true
      responses:
        '200':
          description: Successfully started a run as session
          content:
            application/json:
              example:
                message: Running As user Other User 1 (1234)
              schema:
                type: object
        '404':
          description: Requested user not found
          content:
            application/json:
              example:
                error: Object not found
        '403':
          description: Not authorized to run as this user
          content:
            application/json:
              example:
                error: You are not authorized to access this page.
      tags:
      - Run As
      operationId: run_as_start_post
  /api/v1/run_as/stop:
    post:
      summary: Stop Running As User
      responses:
        '200':
          description: Successfully stopped a run as session
          content:
            application/json:
              example:
                message: Stopped Running as otherUser@magnite.com (1234)
              schema:
                type: object
      tags:
      - Run As
      operationId: run_as_stop_post
components:
  examples:
    run_as_start_internal_user:
      summary: Internal (Magnite) User
      value:
        email: user@magnite.com
    run_as_start_external_user:
      summary: External (Partner) User
      value:
        email: partner@example.com
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
