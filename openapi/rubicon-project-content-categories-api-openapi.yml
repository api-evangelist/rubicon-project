openapi: 3.2.0
info:
  title: SpringServe UI Content Categories API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Content Categories
paths:
  /api/v1/content_categories:
    get:
      summary: List all content categories used by contextual signaling
      description: Unpaginated list of content categories ordered by content_category_id
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    content_category_id:
                      type: string
                      description: Contextual signaling category id
                      example: '123'
                    name:
                      type: string
                      example: Sports
                  required:
                  - content_category_id
                  - name
      tags:
      - Content Categories
      operationId: content_categories_get
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
