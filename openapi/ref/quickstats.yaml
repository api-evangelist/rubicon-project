---
openapi: 3.1.2
components:
  schemas:
    dateRange:
      type: string
      enum:
      - Today
      - Yesterday
      - Last 15 Minutes
      - Last Hour
      - Last 7 Days
      - Last 24 Hours
      - Last 72 Hours
      - Last 30 Days
    forecastDateRange:
      type: string
      enum:
      - T
      - 7
      - W
      - 30
      - M
    QuickstatsMetricValue:
      type: object
      properties:
        current_value:
          type: number
          description: Value for the current time period
        past_value:
          type: number
          description: Value for the past comparison time period
    QuickstatsMetrics:
      type: object
      properties:
        ad_requests:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Total ad requests
        has_ads:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Number of ad requests that had ads available
        opportunities:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Number of opportunities to serve ads
        impressions:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Number of ad impressions served
        clicks:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Number of clicks on ads
        revenue:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Total revenue generated
        cost:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Total cost incurred
        profit:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Profit (revenue - cost)
        ad_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of ad requests that had ads available (has_ads /
            ad_requests * 100)
        use_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of ads that resulted in opportunities (opportunities
            / has_ads * 100)
        opportunity_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of ad requests that resulted in opportunities (opportunities
            / ad_requests * 100)
        efficiency_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of ads that resulted in impressions (impressions
            / has_ads * 100)
        opportunity_fill_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of opportunities that resulted in impressions (impressions
            / opportunities * 100)
        fill_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of ad requests that resulted in impressions (impressions
            / ad_requests * 100)
        click_through_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of impressions that resulted in clicks (clicks /
            impressions * 100)
        margin:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Profit margin as a percentage ((revenue - cost) / revenue *
            100)
        rpm:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Revenue per thousand ad requests (revenue / ad_requests * 1000)
        cpm:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Cost per thousand impressions (cost / impressions * 1000)
        rpmr:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Revenue per thousand ad requests (alias for rpm)
        timeouts:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Total timeouts (opportunity_timeouts + vast_request_timeouts).
            Only emitted by endpoints whose underlying quickstats cache exposes both
            columns (e.g. /api/v1/demand_tags).
        timeout_rate:
          "$ref": "#/components/schemas/QuickstatsMetricValue"
          description: Percentage of ad requests that timed out (timeouts / ad_requests
            * 100). Paired with `timeouts`; same endpoint scoping applies.
    MetricWithChange:
      type: object
      description: A metric value with percentage change from comparison period
      properties:
        value:
          type: number
          description: The raw numeric value of the metric
        pct_change:
          type: number
          description: Percentage change compared to previous period (0.15 = 15% increase,
            -0.05 = 5% decrease)
    QuickstatsSummaryResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            ad_requests:
              "$ref": "#/components/schemas/MetricWithChange"
            usable_requests:
              "$ref": "#/components/schemas/MetricWithChange"
            has_ads:
