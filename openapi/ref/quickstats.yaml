            fourth_quartile:
              "$ref": "#/components/schemas/MetricWithChange"
            ad_percentage:
              "$ref": "#/components/schemas/MetricWithChange"
            use_rate:
              "$ref": "#/components/schemas/MetricWithChange"
            opportunity_percentage:
              "$ref": "#/components/schemas/MetricWithChange"
            fill_percentage:
              "$ref": "#/components/schemas/MetricWithChange"
            click_through_rate:
              "$ref": "#/components/schemas/MetricWithChange"
            efficiency_rate:
              "$ref": "#/components/schemas/MetricWithChange"
            opportunity_fill_percentage:
