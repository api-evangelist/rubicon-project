  /api/v1/hb_bid_maps:
    get:
      summary: Index
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/sortParam
      - $ref: ref/params.yaml#/components/parameters/searchParam
      - $ref: ref/params.yaml#/components/parameters/filterParams
      - $ref: ref/params.yaml#/components/parameters/includeParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HbBidMapsIndexResponse'
      tags:
      - Hb Bid Maps
      operationId: hb_bid_maps_get
    post:
      summary: Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/HbBidMapCreateRequest'
              - type: object
                properties:
                  hb_bid_map_entries:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/HbBidMapEntry'
                      - type: object
                        properties:
                          id:
                            readOnly: true
            examples:
              hb_bid_map_create_simple:
                $ref: '#/components/examples/hb_bid_map_create_simple'
              hb_bid_map_create_full:
                $ref: '#/components/examples/hb_bid_map_create_full'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/HbBidMapCreateRequest'
              - type: object
                properties:
                  csv_file:
                    type: string
                    format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HbBidMapResponseFields'
                - $ref: '#/components/schemas/HbBidMap'
                - $ref: '#/components/schemas/HbBidMapEntryArray'
        '422':
          $ref: ref/errors.yaml#/components/responses/validationError
      tags:
      - Hb Bid Maps
      operationId: hb_bid_maps_post
    servers:
    - url: https://console.springserve.com/api/v1
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/hb_bid_maps/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: number
    get:
      summary: Show
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HbBidMap'
                - $ref: '#/components/schemas/HbBidMapResponseFields'
      tags:
      - Hb Bid Maps
      operationId: hb_bid_maps_id_get
    patch:
      summary: Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/HbBidMapUpdateRequest'
              - type: object
                properties:
                  hb_bid_map_entries:
                    type: array
                    description: Array of bid map entries. Can be used only when the list_action parameter is provided.
                    items:
                      $ref: '#/components/schemas/HbBidMapEntry'
            examples:
              hb_bid_map_update_simple:
                $ref: '#/components/examples/hb_bid_map_update_simple'
              hb_bid_map_update_full:
                $ref: '#/components/examples/hb_bid_map_update_full_2'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/HbBidMapUpdateRequest'
              - type: object
                properties:
                  csv_file:
                    type: string
                    format: binary
                    description: 'CSV file with bid map entries. Can be used only when the list_action parameter is provided. File contains values: bid_floor, parameter_value and id if list_action is remove.'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HbBidMapResponseFields'
                - $ref: '#/components/schemas/HbBidMap'
                - $ref: '#/components/schemas/HbBidMapEntryArray'
        '422':
          $ref: ref/errors.yaml#/components/responses/validationError
      tags:
      - Hb Bid Maps
      operationId: hb_bid_maps_id_patch
    delete:
      summary: Delete
      responses:
        '204':
          description: No content
      tags:
      - Hb Bid Maps
      operationId: hb_bid_maps_id_delete
    servers:
