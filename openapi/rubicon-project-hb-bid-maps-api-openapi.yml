    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
components:
  examples:
    hb_bid_map_update_full:
      summary: Full
      value:
        name: HB Bid Map Name
        description: Updated description
        hb_bid_map_entries:
        - parameter_value: ott3_4035_30
          bid_floor: 1.11
    hb_bid_map_create_full:
      summary: Full
      value:
        name: HB Bid Map Name
        bid_platform: amazon
        hb_bid_map_type: paid
        description: HB Bid Map description
        hb_bid_map_entries:
        - parameter_value: ott1_4033_30
          bid_floor: 1.11
        - parameter_value: ott2_4034_60
          bid_floor: 2.22
    hb_bid_map_create_simple:
      summary: Simple
      value:
        name: HB Bid Map Name
        bid_platform: amazon
        hb_bid_map_type: inventory_split
    hb_bid_map_update_simple:
      summary: Simple
      value:
        name: HB Bid Map Name
    hb_bid_map_update_full_2:
      summary: Full
      value:
        name: HB Bid Map Name
        description: Updated description
        list_action: append
        hb_bid_map_entries:
        - parameter_value: ott3_4035_30
          bid_floor: 1.11
  schemas:
    HbBidMapResponseFields:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HbBidMap:
      type: object
      properties:
        name:
          type: string
          examples:
          - HB Bid Map
        description:
          type: string
          examples:
          - Description of the HB Bid Map
        bid_platform:
          type: string
          examples:
          - amazon
        hb_bid_map_type:
          type: string
          enum:
          - paid
          - inventory_split
          default: inventory_split
          examples:
          - paid
    HbBidMapCreateRequest:
      allOf:
      - $ref: '#/components/schemas/HbBidMap'
      - type: object
        required:
        - name
        - bid_platform
        - hb_bid_map_type
    HbBidMapUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/HbBidMap'
      - type: object
        properties:
          bid_platform:
            readOnly: true
          hb_bid_map_type:
            readOnly: true
          list_action:
            type: string
            enum:
            - append
            - remove
            - replace
            default: append
    HbBidMapEntry:
      type: object
      properties:
        parameter_value:
          type: string
          examples:
          - ott1_4033_30
        bid_floor:
          type: number
          format: float
          examples:
          - 15.0
        id:
          type: integer
          examples:
          - 1
      required:
      - parameter_value
      - bid_floor
    HbBidMapEntryArray:
      type: object
      properties:
        hb_bid_map_entries:
          type: array
          items:
            $ref: '#/components/schemas/HbBidMapEntry'
    HbBidMapsIndexResponse:
      allOf:
      - $ref: ref/params.yaml#/components/schemas/ParamsResponse
      - type: object
        properties:
          results:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/HbBidMap'
              - $ref: '#/components/schemas/HbBidMapResponseFields'
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
