openapi: 3.2.0
info:
  title: SpringServe UI API (V0) Tiles API
  version: 0.1.0
  description: '> **_NOTE:_** This document covers the v0 API (`/api/v0`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Tiles
paths:
  /api/v0/tiles:
    get:
      summary: Index
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: ref/schemas.yaml#/components/schemas/ListResponse
      tags:
      - Tiles
      operationId: tiles_get
    post:
      summary: Create
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              clickable_image_simple:
                $ref: '#/components/examples/tile_creative_clickable_image_create_simple'
              clickable_image_full:
                $ref: '#/components/examples/tile_creative_clickable_image_create_full'
              custom_simple:
                $ref: '#/components/examples/tile_creative_custom_create_simple'
              custom_full:
                $ref: '#/components/examples/tile_creative_custom_create_full'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Tiles
      operationId: tiles_post
  /api/v0/tiles/{id}:
    get:
      summary: Show
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Tiles
      operationId: tiles_id_get
    put:
      summary: Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                $ref: '#/components/examples/tile_creative_update_simple'
              full:
                $ref: '#/components/examples/tile_creative_update_full'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Tiles
      operationId: tiles_id_put
    delete:
      summary: Destroy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
      tags:
      - Tiles
      operationId: tiles_id_delete
