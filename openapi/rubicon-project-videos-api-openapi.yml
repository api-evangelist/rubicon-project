openapi: 3.2.0
info:
  title: SpringServe UI API (V0) Videos API
  version: 0.1.0
  description: '> **_NOTE:_** This document covers the v0 API (`/api/v0`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Videos
paths:
  /api/v0/videos:
    get:
      summary: Index
      description: List video creatives. Supports pagination via page, per, and ids params.
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: List of video creatives
          content:
            application/json:
              schema:
                $ref: ref/schemas.yaml#/components/schemas/ListResponse
      tags:
      - Videos
      operationId: videos_get
    post:
      summary: Create
      description: Create a video creative (from Clearline Demand Tag, Video Creative API docs)
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                $ref: '#/components/examples/video_creative_create_simple'
              full:
                $ref: '#/components/examples/video_creative_create_full'
        required: true
      responses:
        '201':
          description: Created video creative
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1832
                account_id: 1
                name: videofile.mp4
                height: 1080
                width: 1920
                duration_seconds: 14
                video_file_name: VIDEO FILE API DOCS
                video_content_type: video/mp4
                video_file_size: 6737024
                video_updated_at: '2018-08-20T21:25:27.235Z'
                video_remote_url: null
      tags:
      - Videos
      operationId: videos_post
  /api/v0/videos/{id}:
    get:
      summary: Show
      description: Get a Video Creative
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Video creative details
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1832
                account_id: 1
                name: videofile.mp4
                height: 1080
                width: 1920
                duration_seconds: 14
                video_file_name: VIDEO FILE API DOCS
                video_content_type: video/mp4
                video_file_size: 6737024
                video_updated_at: '2018-08-20T21:25:27.235Z'
                video_remote_url: null
      tags:
      - Videos
      operationId: videos_id_get
    put:
      summary: Update
      description: Update a video creative
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                $ref: '#/components/examples/video_creative_update_simple'
              full:
                $ref: '#/components/examples/video_creative_update_full'
      responses:
        '200':
          description: Updated video creative
          content:
            application/json:
              schema:
                type: object
      tags:
      - Videos
      operationId: videos_id_put
    delete:
      summary: Destroy
      description: Delete a video creative
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
      tags:
      - Videos
      operationId: videos_id_delete
