  schemas:
    DeliveryModifierCreate:
      type: object
      required:
      - name
      - modifier_rules
      properties:
        name:
          type: string
          description: Modifier title
        description:
          type: string
          description: Add your own description
        active:
          type: boolean
          description: Default true
          default: true
        modifier_rules:
          type: array
          minItems: 1
          description: At least one rule object required
          items:
            "$ref": "#/components/schemas/DeliveryModifierRule"
    DeliveryModifierRule:
      type: object
      required:
      - source_type
      - multiplier
      - modifier_rule_object
      properties:
        id:
          type: integer
          description: Include when updating an existing rule
        source_type:
          type: string
          enum:
          - values
          - list
          description: |
            - "values" = provide raw values (e.g. modifier_rule_values, country_codes)
            - "list" = reference list IDs (e.g. deal_id_list_ids, domain_list_ids)
        multiplier:
          type: string
          description: Multiplier as decimal string, e.g. "1.05" (5% increment), "0.95"
            (5% decrement)
        modifier_rule_object:
          type: string
          enum:
          - DeviceType
          - OperatingSystem
          - DealIdList
          - PublisherIdList
          - DomainList
          - AppBundleList
          - AppNameList
          - Country
          - MetroArea
          - State
          - City
          - PostalCode
          description: Determines which values key to use (see Values Key Name mapping)
        modifier_rule_values:
          type: array
