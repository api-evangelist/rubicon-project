  "/api/v0/reports":
    post:
      summary: Create Report
      description: |
        Create a report. For Reach & Frequency reports (ClearLine), include interval, timezone, cadences, and async
        exactly as shown. Reports may return QUEUED or BUILDING status; repeat the POST until status is COMPLETE.
        Available for ClearLine account types.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                "$ref": "#/components/examples/report_create_simple"
              full:
                "$ref": "#/components/examples/report_create_full"
      responses:
        '200':
          description: Report result. Status may be QUEUED, BUILDING, or COMPLETE.
          content:
            application/json:
              schema:
                type: object
              example:
                status: COMPLETE
                report_id: "[36-digit report ID]"
                page: 1
                total_pages: 1
                total_rows: 1
                data:
                - total_impressions: 3785905
                  unique_cookies: 3817644
                  cookie_reach: 0.99
                  cost: 66048.81
                  cpm: 17.45
      tags:
      - Reports
      operationId: reports_post
