      - "$ref": ref/params.yaml#/components/parameters/includeParam
      - "$ref": ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - App Bundle Lists
      operationId: app_bundle_lists_get
    post:
      summary: Create
      requestBody:
        content:
          application/json:
            examples:
              simple:
                "$ref": "#/components/examples/app_bundle_list_create_simple"
              full:
