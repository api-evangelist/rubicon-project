  parameters:
    streamingTypeParam:
      name: streaming_type
      in: path
      required: true
      description: The unified-demand streaming type
      schema:
        type: string
        enum:
        - ad_source
        - supply_channel
    q:
      name: q
      description: the string to search for
      in: query
      schema:
        type: string
    limit:
      name: limit
      description: max number of results to return
      in: query
      schema:
        type: string
    with_deleted:
      name: with_deleted
      in: query
      schema:
        type: boolean
    is_active:
      name: is_active
      description: Filter results by active state. `true` returns only active records,
        `false` returns only inactive records. Omit to return both.
      in: query
      schema:
        type: boolean
    account_id:
      name: account_id
      description: Scope the search to the given account instead of your currently
        active account. Only supported for `streaming_publishers` and `streaming_seller_seats`.
      in: query
      schema:
        type: integer
    additionalDataPartnerSegmentParam:
      name: additional_data
      description: Include additional data from non-model sources on the result. Comma-delimited.
      in: query
      schema:
        type: string
        enum:
        - size
        - account_partner_segment
        - size,account_partner_segment
    additionalDataParam:
      name: additional_data
      description: "Include additional data from non-model sources in the response.
        \nSupported values: 'quickstats', 'budget_data'. \nMultiple values can be
        specified as comma-separated (e.g., 'quickstats,budget_data').\n"
      in: query
      schema:
        type: string
      example: quickstats
  responses:
    scheduledReport:
      description: A scheduled report
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/scheduledReport"
    reportTemplate:
      description: A report template
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/reportTemplate"
    reportSerializationError:
      description: Report Serialization Error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/reportSerializationError"
    reportParameterError:
      description: Report Parameter Error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/reportParameterError"
    TargetingResourceBatchResponse:
      description: Successful response for bulk action
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This
        key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This
        key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
