openapi: 3.2.0
info:
  title: SpringServe UI Creatives Audio API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Creatives Audio
paths:
  /api/v1/audio_creatives:
    get:
      tags:
      - Creatives Audio
      summary: Index
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/sortParam
      - $ref: ref/params.yaml#/components/parameters/searchParam
      - $ref: ref/params.yaml#/components/parameters/filterParams
      - $ref: ref/params.yaml#/components/parameters/includeParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioCreativeIndexResponse'
      operationId: audio_creatives_get
    post:
      tags:
      - Creatives Audio
      summary: Create
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - creative
              - demand_partner_id
              properties:
                creative:
                  type: string
                  format: binary
                  description: Audio file to upload
                demand_partner_id:
                  type: number
                  description: ID of the demand partner (required)
                name:
                  type: string
                  description: Name of the creative (optional)
                is_active:
                  type: boolean
                  default: true
                  description: Whether the creative is active (optional, defaults to true)
          application/json:
            schema:
              $ref: '#/components/schemas/AudioCreativeCreateData'
            examples:
              simple:
                $ref: '#/components/examples/audio_creative_create_simple'
              full:
                $ref: '#/components/examples/audio_creative_create_full'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioCreativeResponse'
      operationId: audio_creatives_post
  /api/v1/audio_creatives/{id}:
    get:
      tags:
      - Creatives Audio
      summary: Show
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: ref/params.yaml#/components/parameters/includeParam
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioCreativeResponse'
      operationId: audio_creatives_id_get
    patch:
      tags:
      - Creatives Audio
      summary: Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: ref/params.yaml#/components/parameters/includeParam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioCreativeUpdateData'
            examples:
              simple:
                $ref: '#/components/examples/audio_creative_update_simple'
              full:
                $ref: '#/components/examples/audio_creative_update_full'
        required: false
      responses:
        '200':
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioCreativeResponse'
      operationId: audio_creatives_id_patch
    delete:
      tags:
      - Creatives Audio
      summary: Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '422':
          $ref: ref/errors.yaml#/components/responses/validationError
      operationId: audio_creatives_id_delete
components:
  schemas:
    AudioCreativeResponse:
      allOf:
      - $ref: '#/components/schemas/AudioCreativeBaseProperties'
      - type: object
        properties:
          id:
            type: integer
          account_id:
            type: integer
          demand_partner_id:
            type: integer
          creative_format:
            type: string
          type:
            type: string
          duration_seconds:
            type: number
          creative_file_name:
            type: string
          creative_content_type:
            type: string
          creative_file_size:
            type: integer
          creative_updated_at:
            type: string
            format: date-time
          netflix_pre_approval_enabled:
            type: boolean
          netflix_approval_status:
            type:
            - string
            - 'null'
          netflix_deal_ids:
            type: array
            items:
              type: string
      - $ref: ref/concerns/timestamps.yaml#/components/schemas/Timestamps
    AudioCreativeBaseProperties:
      allOf:
      - type: object
        properties:
          name:
            type: string
          is_active:
            type: boolean
            default: true
          creative_remote_url:
            type:
            - string
            - 'null'
          code:
            type:
            - string
            - 'null'
          secondary_code:
            type:
            - string
            - 'null'
          line_item_demand_tag_ids:
            type: array
            items:
              type: number
          iab_tier_1_category_codes:
            type: array
            items:
              type: string
          iab_tier_2_category_codes:
            type: array
            items:
              type: string
          postal_codes:
            type: array
            items:
              type: string
          postal_code_list_ids:
            type: array
            items:
              type: number
          postal_code_source:
            type: string
          postal_code_white_list:
            type: string
          key_value_targeting:
            type: boolean
          targeted_macros_enabled:
            type: boolean
          all_user_agent_devices:
            type: boolean
          all_user_agent_operating_systems:
            type: boolean
          all_user_agent_browsers:
            type: boolean
          all_user_agent_brands:
            type: boolean
          budget_timezone:
            type: string
          budgets:
            type: array
            items:
              type: object
          day_parting:
            type:
            - array
            - 'null'
            items:
              type: array
              items:
                type: boolean
          day_parting_users_timezone:
            type: boolean
          advertiser_domain:
            type:
            - string
            - 'null'
      - $ref: ref/concerns/tag_pixels.yaml#/components/schemas/TagPixels
      - $ref: ref/concerns/country_codes.yaml#/components/schemas/CountryCodes
      - $ref: ref/concerns/state_codes.yaml#/components/schemas/StateCodes
      - $ref: ref/concerns/metro_area_codes.yaml#/components/schemas/MetroAreaCodes
      - $ref: ref/concerns/city_codes.yaml#/components/schemas/CityCodes
      - $ref: ref/concerns/frequency_caps.yaml#/components/schemas/FrequencyCaps
      - $ref: ref/concerns/demand_key_value.yaml#/components/schemas/DemandKeyValue
      - $ref: ref/concerns/targeted_macro.yaml#/components/schemas/TargetedMacro
      - $ref: ref/concerns/user_agent.yaml#/components/schemas/UserAgent
      - $ref: ref/concerns/flight_dates.yaml#/components/schemas/FlightDates
    AudioCreativeIndexResponse:
      allOf:
      - $ref: ref/params.yaml#/components/schemas/ParamsResponse
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/AudioCreativeResponse'
    AudioCreativeCreateData:
      allOf:
      - $ref: '#/components/schemas/AudioCreativeBaseProperties'
      - type: object
        required:
        - demand_partner_id
        properties:
          demand_partner_id:
            type: number
    AudioCreativeUpdateData:
      $ref: '#/components/schemas/AudioCreativeBaseProperties'
  examples:
    audio_creative_update_simple:
      summary: Simple
      value:
        name: Audio Creative Name
        is_active: true
    audio_creative_create_simple:
      summary: Simple
      value:
        name: Audio Creative Name
        demand_partner_id: 1
        creative_remote_url: https://example.com/audio.mp3
    audio_creative_create_full:
      summary: Full
      value:
        name: Audio Creative Name
        demand_partner_id: 1
        creative_remote_url: https://example.com/audio.mp3
        code: audio-code
        secondary_code: audio-secondary
        advertiser_domain: example.com
        iab_tier_1_category_codes:
        - IAB1
        iab_tier_2_category_codes:
        - IAB1-1
        line_item_demand_tag_ids:
        - 1
        country_source: list
        country_list_ids:
        - 1
        state_source: list
        state_list_ids:
        - 1
        city_source: list
        city_list_ids:
        - 1
        metro_area_source: list
        metro_area_list_ids:
        - 1
        postal_code_source: list
        postal_code_list_ids:
        - 1
        key_value_targeting: true
        targeted_macros_enabled: true
        all_user_agent_devices: true
        all_user_agent_operating_systems: true
        all_user_agent_browsers: true
        all_user_agent_brands: true
        budget_timezone: America/New_York
        budgets:
        - budget_period: day
          budget_metric: impressions
          budget_value: 1
          budget_pacing: smooth
        start_date: '2026-01-01'
        end_date: '2026-12-31'
        flight_dates_timezone: America/New_York
        day_parting_users_timezone: true
        tag_pixels:
        - pixel_type: AdImpression
          pixel_url: https://pixel.example.com/imp
          pixel_format: image
        is_active: true
    audio_creative_update_full:
      summary: Full
      value:
        name: Audio Creative Name
        code: audio-code
        secondary_code: audio-secondary
        advertiser_domain: example.com
        iab_tier_1_category_codes:
        - IAB1
        iab_tier_2_category_codes:
        - IAB1-1
        line_item_demand_tag_ids:
        - 1
        country_source: list
        country_list_ids:
        - 1
        state_source: list
        state_list_ids:
        - 1
        city_source: list
        city_list_ids:
        - 1
        metro_area_source: list
        metro_area_list_ids:
        - 1
        postal_code_source: list
        postal_code_list_ids:
        - 1
        key_value_targeting: true
        targeted_macros_enabled: true
        all_user_agent_devices: true
        all_user_agent_operating_systems: true
        all_user_agent_browsers: true
        all_user_agent_brands: true
        budget_timezone: America/New_York
        budgets:
        - budget_period: day
          budget_metric: impressions
          budget_value: 1
          budget_pacing: smooth
        start_date: '2026-01-01'
        end_date: '2026-12-31'
        flight_dates_timezone: America/New_York
        day_parting_users_timezone: true
        tag_pixels:
        - pixel_type: AdImpression
          pixel_url: https://pixel.example.com/imp
          pixel_format: image
        is_active: true
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
