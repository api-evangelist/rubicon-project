openapi: 3.2.0
info:
  title: Rubicon Project Demand Tags API
  version: '1.0'
  description: 'Operations tagged Demand Tags across 2 of this provider''s published API definitions: rubicon-project-springserve-v0-openapi.yml, rubicon-project-springserve-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://console.springserve.com/api/v0
  description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
- url: https://console.clearline.magnite.com/api/v0
  description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
- url: https://console.springserve.com/api/v1
  description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
- url: https://console.clearline.magnite.com/api/v1
  description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
security:
- api_key: []
- bearer_token: []
tags:
- name: Demand Tags
paths:
  /api/v0/demand_tags:
    get:
      summary: Index
      description: Get demand tags based on multiple conditions
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: List of demand tags
          content:
            application/json:
              schema:
                $ref: ref/schemas.yaml#/components/schemas/ListResponse
      tags:
      - Demand Tags
      operationId: demand_tags_get
    post:
      summary: Create
      description: Creating a Demand Tag
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              tag_simple:
                $ref: '#/components/examples/demand_tag_tag_create_simple'
              tag_full:
                $ref: '#/components/examples/demand_tag_tag_create_full'
              bidder_simple:
                $ref: '#/components/examples/demand_tag_bidder_create_simple'
              bidder_full:
                $ref: '#/components/examples/demand_tag_bidder_create_full'
              line_item_simple:
                $ref: '#/components/examples/demand_tag_line_item_create_simple'
              line_item_full:
                $ref: '#/components/examples/demand_tag_line_item_create_full'
              house_ad_simple:
                $ref: '#/components/examples/demand_tag_house_ad_create_simple'
              house_ad_full:
                $ref: '#/components/examples/demand_tag_house_ad_create_full'
              dsp_sub_line_item_simple:
                $ref: '#/components/examples/demand_tag_dsp_sub_line_item_create_simple'
              dsp_sub_line_item_full:
                $ref: '#/components/examples/demand_tag_dsp_sub_line_item_create_full'
              marketplace_deal_simple:
                $ref: '#/components/examples/demand_tag_marketplace_deal_create_simple'
              marketplace_deal_full:
                $ref: '#/components/examples/demand_tag_marketplace_deal_create_full'
        required: true
      responses:
        '201':
          description: Created demand tag
          content:
            application/json:
              schema:
                type: object
              example:
                account_id: 1
                active: true
                id: 30424
                name: TEST API DOCS
                rate: '0.01'
                demand_partner_id: 1764
                vast_endpoint_url: https://staging-tv.springserve.com/vast
      tags:
      - Demand Tags
      operationId: demand_tags_post
    servers:
    - url: https://console.springserve.com/api/v0
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v0
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v0/demand_tags/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show
      description: Get a demand tag by id
      responses:
        '200':
          description: Demand tag details
          content:
            application/json:
              schema:
                type: object
              example:
                account_id: 1
                active: true
                id: 30424
                name: TEST API DOCS
                rate: '0.01'
                demand_partner_id: 1764
                vast_endpoint_url: https://staging-tv.springserve.com/vast
      tags:
      - Demand Tags
      operationId: demand_tags_id_get
    put:
      summary: Update
      description: Edit a Demand Tag (e.g. name, or budgets). See Clearline Demand Tag Budgets API docs for budget fields.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                advanced_floor_rules:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      dimension:
                        type: string
                        enum:
                        - adomain
                        - duration
                        - country
                        - iab_tier_1
                        - iab_tier_2
                      values:
                        type: array
                        items:
                          type: string
                      floor_price:
                        type: number
            examples:
              simple:
                $ref: '#/components/examples/demand_tag_update_simple'
              full:
                $ref: '#/components/examples/demand_tag_update_full'
      responses:
        '200':
          description: Updated demand tag
          content:
            application/json:
              schema:
                type: object
              example:
                account_id: 1
                active: true
                demand_partner_id: 1764
                id: 30424
                name: I want to change the name
                rate: '0.01'
                vast_endpoint_url: https://staging-tv.springserve.com/vast
      tags:
      - Demand Tags
      operationId: demand_tags_id_put
    delete:
      summary: Destroy
      description: Delete a demand tag
      responses:
        '204':
          description: No content
      tags:
      - Demand Tags
      operationId: demand_tags_id_delete
    servers:
    - url: https://console.springserve.com/api/v0
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v0
