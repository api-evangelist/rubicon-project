            type:
            - string
            - 'null'
          guaranteed_delivery:
            type: boolean
          guaranteed_tier:
            type:
            - string
            - 'null'
          is_reserved:
            type: boolean
          isp_source:
            type: string
          isp_white_list:
            $ref: ref/types.yaml#/components/schemas/BooleanOrEmptyString
          key_value_targeting:
            type: boolean
          multi_call_enabled:
            type: boolean
          multi_call_maximum:
            type: integer
            format: int32
          partner_tier_override_enabled:
            type: boolean
          partner_tier_override:
            type:
            - string
            - 'null'
          post_imp_detection_enabled:
            type: boolean
          post_imp_percentage_forensiq:
            type: integer
            format: int32
          post_imp_percentage_ias:
            type: integer
            format: int32
          post_imp_percentage_moat:
