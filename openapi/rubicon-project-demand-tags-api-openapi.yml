      - $ref: ref/concerns/country_codes.yaml#/components/schemas/CountryCodes
      - $ref: ref/concerns/demand_key_value.yaml#/components/schemas/DemandKeyValue
      - $ref: ref/concerns/domain_list.yaml#/components/schemas/DomainList
      - $ref: ref/concerns/environment.yaml#/components/schemas/Environment
      - $ref: ref/concerns/flight_dates.yaml#/components/schemas/FlightDates
      - $ref: ref/concerns/format.yaml#/components/schemas/Format
      - $ref: ref/concerns/frequency_caps.yaml#/components/schemas/FrequencyCaps
      - $ref: ref/concerns/ip_list.yaml#/components/schemas/IpList
      - $ref: ref/concerns/metro_area_codes.yaml#/components/schemas/MetroAreaCodes
      - $ref: ref/concerns/player_sizes.yaml#/components/schemas/PlayerSizes
      - $ref: ref/concerns/postal_codes.yaml#/components/schemas/PostalCodes
      - $ref: ref/concerns/privacy_targeting.yaml#/components/schemas/PrivacyTargeting
      - $ref: ref/concerns/segment_groups.yaml#/components/schemas/SegmentGroups
      - $ref: ref/concerns/state_codes.yaml#/components/schemas/StateCodes
      - $ref: ref/concerns/tag_pixels.yaml#/components/schemas/TagPixels
      - $ref: ref/concerns/targeted_macro.yaml#/components/schemas/TargetedMacro
      - $ref: ref/concerns/timestamps.yaml#/components/schemas/Timestamps
      - $ref: ref/concerns/user_agent.yaml#/components/schemas/UserAgent
      - type: object
        properties:
          id:
            type: integer
            format: int64
          account_id:
            type: integer
            format: int64
          name:
            type: string
          is_active:
            type: boolean
          is_new:
            type: boolean
            description: Whether the demand tag is in the "new" state (legacy index parity).
          note:
            type:
            - string
            - 'null'
          rate:
            type: string
          player_size_targeting:
            type: string
          direct_connect:
            type: boolean
          media_file_mime_type_targeting:
            type: boolean
          media_file_mime_types:
            type: array
            items:
              type: string
          blocking_unknown_media_file_mime_type:
            type: boolean
          media_file_duration_targeting:
            type: boolean
          media_file_min_duration:
            type:
            - string
            - 'null'
          media_file_max_duration:
            type:
            - string
            - 'null'
          blocking_unknown_media_file_duration:
            type: boolean
          media_file_bit_rate_targeting:
            type: boolean
          media_file_min_bit_rate:
            type:
            - string
            - 'null'
          media_file_max_bit_rate:
            type:
            - string
            - 'null'
          blocking_unknown_media_file_bit_rate:
            type: boolean
          targeted_macros_enabled:
            type: boolean
          blocking_unknown_media_containers:
            type: boolean
          media_file_media_container_targeting:
            type: boolean
          media_file_media_containers:
            type: array
            items:
              type: string
          media_file_audio_volume_targeting:
            type: boolean
          media_file_audio_volume_mean:
            type:
            - string
            - 'null'
          blocking_unknown_media_file_audio_volume:
            type: boolean
          blocking_vast_containing_companion_ads:
            type: boolean
          removing_companion_ads_from_vast:
            type: boolean
          creative_political_ads:
            type: array
            items:
              type: string
          type:
            type:
            - string
            - 'null'
          blocking_stitched_creatives:
            type: boolean
          budget_timezone:
            type: string
          creative_language_allow_list:
            $ref: ref/types.yaml#/components/schemas/BooleanOrEmptyString
          creative_language_codes:
            type: array
            items:
              type: string
          creative_language_block_unknown:
            type: boolean
          allow_tier_breakout:
            type: boolean
          override_supply_floor:
            type: boolean
          audited_creative_statuses:
            type: array
            items:
              type: string
          bid_floor_type:
            type: string
          bid_margin:
            type:
            - string
            - 'null'
          bid_optional_params:
            type:
            - object
            - 'null'
          bid_params:
            type:
            - object
            - 'null'
          bid_platform:
            type:
            - string
            - 'null'
          bidder_type:
            type:
            - string
            - 'null'
