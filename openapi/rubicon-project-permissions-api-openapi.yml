openapi: 3.2.0
info:
  title: SpringServe UI Permissions API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Permissions
paths:
  /api/v1/permissions:
    get:
      summary: List system-wide permissions
      description: List system-wide permissions that are not necessarily specific to a single resource type
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Permissions
      operationId: permissions_get
  /api/v1/permissions/apps:
    get:
      summary: List component permissions
      description: 'List permissions for SpringServe components: supply, demand, targeting etc.'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Permissions
      operationId: permissions_apps_get
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
