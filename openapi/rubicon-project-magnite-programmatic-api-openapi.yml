openapi: 3.2.0
info:
  title: SpringServe UI Magnite Programmatic API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Magnite Programmatic
paths:
  /api/v1/magnite_programmatic/contentMetadata/search:
    get:
      summary: Search content-targeting values from Magnite SpringServe
      description: Returns content-targeting picklist values from Magnite SpringServe
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search query forwarded to the Magnite SpringServe API
      - name: field
        in: query
        required: true
        schema:
          type: string
          enum:
          - videoId
          - videoTitle
          - seriesName
          - season
          - episode
          - contentLength
          - contentCategoriesSet
          - contentRating
          - genre
          - producer
          - contentNetwork
          - contentChannel
        description: Target field to extract from Magnite Streaming results
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      example: Sports
                    text:
                      type: string
                      example: Sports
                  required:
                  - value
                  - text
        '400':
          description: bad request
          content:
            application/json:
              examples:
                missing_seats:
                  summary: No Magnite SpringServe seats configured for account
                  value:
                    error: No valid Magnite SpringServe seats for account 123
                missing_field:
                  summary: Missing field parameter
                  value:
                    error: Field param is required
                invalid_field:
                  summary: Unsupported field parameter
                  value:
                    error: 'Field param is invalid. Allowed values: videoId, videoTitle, seriesName, season, episode, contentLength, contentCategoriesSet, contentRating, genre, producer, contentNetwork, contentChannel'
              schema:
                type: object
                properties:
                  error:
                    type: string
      tags:
      - Magnite Programmatic
      operationId: magnite_programmatic_contentMetadata_search_get
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
