openapi: 3.2.0
info:
  title: SpringServe UI Search API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Search
paths:
  /api/v1/search:
    get:
      summary: Universal
      description: Universal Search across all entity types
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Search
      operationId: search_get
  /api/v1/search/{entity}:
    get:
      summary: Search within a given type of entity
      parameters:
      - name: entity
        in: path
        required: true
        schema:
          type: string
          enum:
          - account_managers
          - ad_servers
          - advertiser_domain_lists
          - app_bundle_lists
          - app_name_lists
          - audiences
          - bid_modifiers
          - bid_platforms
          - campaign_codes
          - campaign_secondary_codes
          - cities
          - city_lists
          - city_names
          - clearline_deals
          - clearline_rtd_signals
          - countries
          - country_lists
          - creative_codes
          - creative_secondary_codes
          - creative_languages
          - creatives
          - curator_fee_publishers
          - deal_id_lists
          - deal_ids
          - deal_lists
          - deals
          - delivery_modifiers
          - demand_codes
          - demand_labels
          - demand_partner_codes
          - demand_partner_secondary_codes
          - demand_tag_secondary_codes
          - metro_areas
          - metro_area_lists
          - domain_lists
          - established_direct_connect_accounts
          - external_deal_ids
          - foreign_deal_codes
          - foreign_deal_ids
          - foreign_deal_names
          - global_fcap_pixels
          - iab_category_tier1_lists
          - iab_category_tier2_lists
          - ip_lists
          - isps
          - isp_lists
          - keys
          - keyword_lists
          - marketplace_buyer_buyer_seats
          - marketplace_buyer_dsps
          - parameter_lists
          - partner_segment_codes
          - partner_segments
          - polygon_lists
          - postal_code_lists
          - predefined_key_values
          - publisher_id_lists
          - scanned_creative_lists
          - segments
          - state_lists
          - states
          - streaming_publishers
          - streaming_seller_seat_lists
          - streaming_seller_seats
          - supply_tag_codes
          - supply_partner_codes
          - supply_router_codes
          - supply_labels
          - supply_partners
          - supply_routers
          - vendors
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - $ref: '#/components/parameters/account_id'
      - name: demand_partner_permission_ids
        description: Filter based on the demand partner(s) selected for the given objects. Only supported for app_bundle_lists, app_name_lists, city_lists, country_lists, deal_lists, deals, metro_area_lists, global_fcap_pixels, ip_lists, postal_code_lists, publisher_id_lists, segments, state_lists, and streaming_seller_seat_lists.
        in: query
        schema:
          oneOf:
          - type: integer
          - type: array
            items:
              type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Search
      operationId: search_entity_get
  /api/v1/search/account_managers:
    get:
      summary: Search for account managers
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - name: partner_type
        in: query
        description: filter by supply or demand partner account managers
        schema:
          type: string
          enum:
          - supply
          - demand
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1SearchResponse'
      tags:
      - Search
      operationId: search_account_managers_get
  /api/v1/search/ad_servers:
    get:
      summary: Search for ad servers
      description: Typeahead for VAST ad servers. Database rows include id for macro suggester; SpringServe, Other, and header-bidding platforms return id null.
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Matching ad server options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdServerSearchResult'
      tags:
      - Search
      operationId: search_ad_servers_get
  /api/v1/search/campaigns:
    get:
      summary: Search for demand tags
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: demand_partner_id
        in: query
        schema:
          type: number
      - name: exclude_open_market
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      is_active:
                        type: boolean
                      direct_connection:
                        type: string
      tags:
      - Search
      operationId: search_campaigns_get
  /api/v1/search/deal_lists:
    get:
      summary: Search for supply partners
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: exclude_empty_list
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      is_active:
                        type: boolean
      tags:
      - Search
      operationId: search_deal_lists_get
  /api/v1/search/demand_partners:
    get:
      summary: Search for demand partners
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: supply_tag_id
        in: query
        description: filter by Demand Partners associated with Demand Tags that are in Demand Tag Priorities for the specified Supply Tag
        schema:
          type: number
      - name: managed
        in: query
        description: filter by Managed (i.e. not Direct Connect) Demand Partners
        schema:
          type: boolean
      - name: direct_connect
        in: query
        description: filter by Direct Connect Demand Partners
        schema:
          type: boolean
      - name: exclude_open_market
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      is_active:
                        type: string
      tags:
      - Search
      operationId: search_demand_partners_get
  /api/v1/search/demand_tags:
    get:
      summary: Search for demand tags
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - audio
          - tile
          - video
      - name: exclude_open_market
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      is_active:
                        type: boolean
                      direct_connection:
                        type: string
      tags:
      - Search
      operationId: search_demand_tags_get
  /api/v1/search/displayable_accounts:
    get:
      summary: Search for displayable accounts
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: platform_type
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      is_active:
                        type: boolean
      tags:
      - Search
      operationId: search_displayable_accounts_get
  /api/v1/search/iab_category:
    get:
      summary: Search for iab categories
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - name: tier
        in: query
        schema:
          type: number
          enum:
          - 1
          - 2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      value:
                        type: string
      tags:
      - Search
      operationId: search_iab_category_get
  /api/v1/search/key_keys:
    get:
      summary: Search for Keys
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - name: definition_type
        in: query
        schema:
          type: string
          enum:
          - free
          - predefined
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      value:
                        type: string
                      definition_type:
                        type: string
      tags:
      - Search
      operationId: search_key_keys_get
  /api/v1/search/supply_partners:
    get:
      summary: Search for supply partners
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: direct_io_publishers_only
        in: query
        schema:
          type: boolean
      - name: managed
        in: query
        description: filter by Managed (i.e. not Direct Connect) Supply Partners
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
      tags:
      - Search
      operationId: search_supply_partners_get
  /api/v1/search/supply_tags:
    get:
      summary: Search for supply tags
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - $ref: '#/components/parameters/is_active'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - audio
          - tile
          - video
      - name: waterfall_management
        in: query
        schema:
          type: string
          enum:
          - campaign
          - campaign_side
          - demand_tag
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/V1SearchResponseItem'
                  - type: object
                    properties:
                      type:
                        type: string
                      is_active:
                        type: boolean
                      custom_data:
                        type: object
                        properties:
                          slot_orders:
                            type: array
                            items:
                              type: string
                          slot_numbers:
                            type: array
                            nullable: true
      tags:
      - Search
      operationId: search_supply_tags_get
  /api/v1/search/user_accounts:
    get:
      summary: Search for user accounts
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/with_deleted'
      - name: is_demand_forecast_creator
        in: query
        description: filter by User Accounts that are associated with Demand Forecasts
        schema:
          type: boolean
      - name: is_clearline_forecast_creator
        in: query
        description: filter by User Accounts that are associated with Clearline Forecasts
        schema:
          type: boolean
      - name: is_csv_report_creator
        in: query
        description: filter by User Accounts that are associated with CSV Reports
        schema:
          type: boolean
      - name: is_scheduled_report_creator
        in: query
        description: filter by User Accounts that are associated with Scheduled Reports
        schema:
          type: boolean
      - name: is_report_template_creator
        in: query
        description: filter by User Accounts that are associated with Report Templates
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1SearchResponse'
      tags:
      - Search
      operationId: search_user_accounts_get
components:
  schemas:
    V1SearchResponse:
      type: array
      items:
        allOf:
        - $ref: '#/components/schemas/V1SearchResponseItem'
    V1SearchResponseItem:
      type: object
      properties:
        id:
          type: number
        label:
          type: string
    AdServerSearchResult:
      type: object
      required:
      - name
      - url_match
      properties:
        id:
          type: integer
          nullable: true
          description: AdServer primary key; null for SpringServe, Other, and header-bidding platform options.
        name:
          type: string
        url_match:
          type: string
  parameters:
    q:
      name: q
      description: the string to search for
      in: query
      schema:
        type: string
    account_id:
      name: account_id
      description: Scope the search to the given account instead of your currently active account. Only supported for `streaming_publishers` and `streaming_seller_seats`.
      in: query
      schema:
        type: integer
    is_active:
      name: is_active
      description: Filter results by active state. `true` returns only active records, `false` returns only inactive records. Omit to return both.
      in: query
      schema:
        type: boolean
    limit:
      name: limit
      description: max number of results to return
      in: query
      schema:
        type: string
    with_deleted:
      name: with_deleted
      in: query
      schema:
        type: boolean
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
