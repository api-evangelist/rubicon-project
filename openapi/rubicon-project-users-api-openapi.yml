components:
  examples:
    user_update_current_simple:
      summary: Simple
      value:
        name: User Name
        timezone: America/New_York
    user_update_current_full:
      summary: Full
      value:
        name: User Name
        timezone: America/New_York
        default_report_template_id: 1
        notification_opt_outs:
        - DC Requests
        all_notification_opt_outs: false
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
