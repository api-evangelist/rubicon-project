openapi: 3.2.0
info:
  title: SpringServe UI API (V0) First Party Partner Segments API
  version: 0.1.0
  description: '> **_NOTE:_** This document covers the v0 API (`/api/v0`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: First Party Partner Segments
paths:
  /api/v0/first_party_partner_segments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Destroy
      responses:
        '204':
          description: No content
      tags:
      - First Party Partner Segments
      operationId: first_party_partner_segments_id_delete
  /api/v0/first_party_partner_segments/bulk_create:
    post:
      summary: Bulk Create
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              single:
                $ref: '#/components/examples/first_party_partner_segment_bulk_create_single'
              multiple:
                $ref: '#/components/examples/first_party_partner_segment_bulk_create_multiple'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - First Party Partner Segments
      operationId: first_party_partner_segments_bulk_create_post
components:
  examples:
    first_party_partner_segment_bulk_create_single:
      summary: Bulk create — single item
      value:
        first_party_partner_segments:
        - code: SEG-001
          vendor_id: 1
          category: automotive
          dmp_segment_id: 1
          description: First party segment
          cpm: 1.11
          political: false
          adv_id: 1
          enabled: true
          account_ids:
          - 1
    first_party_partner_segment_bulk_create_multiple:
      summary: Bulk create — multiple items
      value:
        first_party_partner_segments:
        - code: SEG-001
          vendor_id: 1
          category: automotive
          dmp_segment_id: 1
          description: First party segment
          cpm: 1.11
          political: false
          adv_id: 1
          enabled: true
          account_ids:
          - 1
        - code: SEG-002
          vendor_id: 1
          category: sports
          dmp_segment_id: 1
          description: Second first party segment
          cpm: 1.11
          political: false
          adv_id: 1
          enabled: false
          account_ids: []
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
