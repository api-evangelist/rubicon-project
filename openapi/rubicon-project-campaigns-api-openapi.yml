openapi: 3.2.0
info:
  title: SpringServe UI API (V0) Campaigns API
  version: 0.1.0
  description: '> **_NOTE:_** This document covers the v0 API (`/api/v0`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Campaigns
paths:
  /api/v0/campaigns:
    get:
      summary: Index
      description: List all campaigns. Supports pagination via page, per, and ids params.
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: ref/schemas.yaml#/components/schemas/ListResponse
      tags:
      - Campaigns
      operationId: campaigns_get
    post:
      summary: Create
      description: Creating a Campaign
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              managed_simple:
                $ref: '#/components/examples/campaign_managed_create_simple'
              managed_full:
                $ref: '#/components/examples/campaign_managed_create_full'
              direct_connect_simple:
                $ref: '#/components/examples/campaign_direct_connect_create_simple'
              direct_connect_full:
                $ref: '#/components/examples/campaign_direct_connect_create_full'
              tiles_dedup_simple:
                $ref: '#/components/examples/campaign_tiles_dedup_create_simple'
              tiles_dedup_full:
                $ref: '#/components/examples/campaign_tiles_dedup_create_full'
        required: true
      responses:
        '201':
          description: Created campaign
          content:
            application/json:
              schema:
                type: object
              example:
                name: My Campaign
                has_rate: true
                rate: 10.0
                demand_partner_id: 52
      tags:
      - Campaigns
      operationId: campaigns_post
  /api/v0/campaigns/{id}:
    get:
      summary: Show
      description: Get a Campaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                type: object
      tags:
      - Campaigns
      operationId: campaigns_id_get
    put:
      summary: Update
      description: Add Demand Tags to your Campaign or Edit a Campaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                $ref: '#/components/examples/campaign_update_simple'
              full:
                $ref: '#/components/examples/campaign_update_full'
      responses:
        '200':
          description: Updated campaign
          content:
            application/json:
              schema:
                type: object
              example:
                id: 39
                account_id: 1
                name: My Campaign
                rate: null
                has_rate: false
                demand_partner_id: 52
                demand_tag_ids:
                - 22312
                - 45923
      tags:
      - Campaigns
      operationId: campaigns_id_put
    delete:
      summary: Destroy
      description: Delete a campaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
      tags:
      - Campaigns
      operationId: campaigns_id_delete
