openapi: 3.2.0
info:
  title: SpringServe UI Header Bidding Platforms API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Header Bidding Platforms
paths:
  /api/v1/header_bidding_platforms:
    get:
      summary: List Header Bidding Platforms
      description: This is not a paginated/filtered list, but rather returns all results
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Header Bidding Platforms
      operationId: header_bidding_platforms_get
  /api/v1/header_bidding_platforms/restricted:
    get:
      summary: List restricted Header Bidding Platforms
      description: This is not a paginated/filtered list, but rather returns all results
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Header Bidding Platforms
      operationId: header_bidding_platforms_restricted_get
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
