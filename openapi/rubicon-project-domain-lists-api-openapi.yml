      operationId: domain_lists_id_domains_get
    servers:
    - url: https://console.springserve.com/api/v1
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/domain_lists/{id}/duplicate:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Duplicate Domain List
      description: Returns a non-persisted preview of a duplicate of the domain list.
      responses:
        '200':
          description: Domain List defaults, copied from an existing Domain List
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  is_active:
                    type: boolean
                  demand_partner_permission_ids:
                    type: array
                    items:
                      type: integer
        '404':
          $ref: ref/errors.yaml#/components/responses/notFoundError
      tags:
      - Domain Lists
      operationId: domain_lists_id_duplicate_get
    post:
      summary: Create Domain List Duplicate
      description: 'Persists a new domain list from the submitted basic info and copies the original''s domains into the new list. When demand partner expansion is enabled, demand_partner_permission_ids is required.

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainListDuplicateRequest'
            examples:
              enabled_demand_partners_expansion:
                $ref: '#/components/examples/domain_list_duplicate_enabled_demand_partners_expansion'
              disabled_demand_partners_expansion:
                $ref: '#/components/examples/domain_list_duplicate_disabled_demand_partners_expansion'
              another_account:
                $ref: '#/components/examples/domain_list_duplicate_another_account'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: ref/errors.yaml#/components/responses/notFoundError
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      tags:
      - Domain Lists
      operationId: domain_lists_id_duplicate_post
