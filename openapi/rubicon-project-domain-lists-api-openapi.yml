    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/domain_lists/{id}/domains:
    get:
      summary: Domains
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: preview
        in: query
        description: If true, returns only a truncated preview of the domains (first ~80KB read from storage) instead of the full list
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
