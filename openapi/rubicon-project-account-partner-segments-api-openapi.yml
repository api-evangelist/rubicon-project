openapi: 3.2.0
info:
  title: SpringServe UI Account Partner Segments API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Account Partner Segments
paths:
  /api/v1/account_partner_segments:
    post:
      summary: Create
      requestBody:
        content:
          application/json:
            examples:
              account_partner_segment_create_simple:
                $ref: '#/components/examples/account_partner_segment_create_simple'
              account_partner_segment_create_full:
                $ref: '#/components/examples/account_partner_segment_create_full'
            schema:
              type: object
        required: true
      responses:
        '201':
          description: Created a new account partner segment
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Returned an existing account partner segment
          content:
            application/json:
              schema:
                type: object
      tags:
      - Account Partner Segments
      operationId: account_partner_segments_post
  /api/v1/account_partner_segments/{id}:
    patch:
      summary: Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              account_partner_segment_update_simple:
                $ref: '#/components/examples/account_partner_segment_update_simple'
              account_partner_segment_update_full:
                $ref: '#/components/examples/account_partner_segment_update_full'
            schema:
              type: object
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Account Partner Segments
      operationId: account_partner_segments_id_patch
  /api/v1/account_partner_segments/bulk_update:
    post:
      summary: Bulk Update
      requestBody:
        content:
          application/json:
            examples:
              account_partner_segment_bulk_update_single:
                $ref: '#/components/examples/account_partner_segment_bulk_update_single'
              account_partner_segment_bulk_update_multiple:
                $ref: '#/components/examples/account_partner_segment_bulk_update_multiple'
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Bulk update completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Status message describing the bulk update results
                examples:
                - message: 'Successfully updated 5 Account Partner Segments: 251, 1789, 2024, 2026, 2848'
      tags:
      - Account Partner Segments
      operationId: account_partner_segments_bulk_update_same_attributes_post
components:
  examples:
    account_partner_segment_create_full:
      summary: Create with all fields
      value:
        partner_segment_id: 1
        is_active: true
    account_partner_segment_bulk_update_single:
      summary: Bulk update a single segment
      value:
        object_ids:
        - 1
        is_active: true
    account_partner_segment_update_full:
      summary: Update all mutable fields
      value:
        is_active: true
    account_partner_segment_bulk_update_multiple:
      summary: Bulk update multiple segments
      value:
        object_ids:
        - 1
        - 2
        is_active: true
    account_partner_segment_update_simple:
      summary: Update active status only
      value:
        is_active: false
    account_partner_segment_create_simple:
      summary: Create with required fields only
      value:
        partner_segment_id: 1
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
