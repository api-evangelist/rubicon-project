            - multimedia
            - ih_clicktoweb_iv
            - ih_clicktoweb
            - ih_clicktovideo_iv
            - ih_clicktovideo
      - $ref: ref/concerns/tag_pixels.yaml#/components/schemas/TagPixels
      - $ref: ref/concerns/country_codes.yaml#/components/schemas/CountryCodes
      - $ref: ref/concerns/state_codes.yaml#/components/schemas/StateCodes
      - $ref: ref/concerns/metro_area_codes.yaml#/components/schemas/MetroAreaCodes
      - $ref: ref/concerns/city_codes.yaml#/components/schemas/CityCodes
      - $ref: ref/concerns/frequency_caps.yaml#/components/schemas/FrequencyCaps
      - $ref: ref/concerns/demand_key_value.yaml#/components/schemas/DemandKeyValue
      - $ref: ref/concerns/targeted_macro.yaml#/components/schemas/TargetedMacro
      - $ref: ref/concerns/user_agent.yaml#/components/schemas/UserAgent
      - $ref: ref/concerns/flight_dates.yaml#/components/schemas/FlightDates
    TileCreativeIndexResponse:
      allOf:
      - $ref: ref/params.yaml#/components/schemas/ParamsResponse
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/TileCreativeResponse'
    TileCreativeUpdateData:
      $ref: '#/components/schemas/TileCreativeBaseProperties'
    TileCreativeCreateData:
      type: object
      required:
      - demand_partner_id
      - creative_landing_page_url
      - name
      - tiles_template
      properties:
        demand_partner_id:
          type: number
        name:
          type: string
        tiles_template:
          type: string
          enum:
          - clickable_image
          - clickable_video
          - custom
          - multimedia
          - ih_clicktoweb_iv
          - ih_clicktoweb
          - ih_clicktovideo_iv
          - ih_clicktovideo
        creative_landing_page_url:
          type: string
        creative_input_types:
          type: array
          default: []
          items:
            type: string
            enum:
            - file
            - url
          description: 'One entry per asset slot indicating whether that position uses a file upload or URL. Order must match the template''s asset order (e.g. ih_clicktovideo: background, logo, full screen video, end card; ih_clicktovideo_iv: background, logo, immersion video, full screen video, end card).'
        creative_remote_urls:
          type: array
          items:
            type: string
          description: URLs in positional order, one per 'url' entry in creative_input_types
        is_active:
          type: boolean
          default: true
    TileCreativeMultipartData:
      type: object
      required:
      - demand_partner_id
      - name
      - tiles_template
      - creative_landing_page_url
      properties:
        demand_partner_id:
          type: number
          description: ID of the demand partner (required)
        name:
          type: string
          description: Name of the creative (required)
        tiles_template:
          type: string
          enum:
          - clickable_image
          - clickable_video
          - custom
          - multimedia
          - ih_clicktoweb_iv
          - ih_clicktoweb
          - ih_clicktovideo_iv
          - ih_clicktovideo
          description: Select one of the available templates (required)
        creative_landing_page_url:
          type: string
          description: Landing page URL (required)
        creatives:
          type: array
          items:
            type: string
            format: binary
          description: File uploads in positional order, one per 'file' entry in creative_input_types
        is_active:
          type: boolean
          default: true
          description: Whether the creative is active (optional, defaults to true)
    TileCreativeResponse:
      allOf:
      - $ref: '#/components/schemas/TileCreativeBaseProperties'
      - type: object
        properties:
          id:
            type: integer
          account_id:
            type: integer
          demand_partner_id:
            type: integer
          creative_format:
            type: string
          type:
            type: string
          creative_file_name:
            type: string
          creative_content_type:
            type: string
          creative_file_size:
            type: integer
          creative_updated_at:
            type: string
            format: date-time
          custom:
            type: boolean
          netflix_pre_approval_enabled:
            type: boolean
          netflix_approval_status:
            type:
            - string
            - 'null'
          netflix_deal_ids:
            type: array
            items:
              type: string
