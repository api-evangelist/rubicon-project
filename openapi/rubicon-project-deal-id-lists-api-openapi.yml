openapi: 3.2.0
info:
  title: SpringServe UI API (V0) Deal Id Lists API
  version: 0.1.0
  description: '> **_NOTE:_** This document covers the v0 API (`/api/v0`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Deal Id Lists
paths:
  /api/v0/deal_id_lists:
    get:
      summary: Index
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: ref/schemas.yaml#/components/schemas/ListResponse
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_get
    post:
      summary: Create
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                $ref: '#/components/examples/deal_id_list_create_simple'
              full:
                $ref: '#/components/examples/deal_id_list_create_full'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_post
  /api/v0/deal_id_lists/{id}:
    get:
      summary: Show
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_id_get
    put:
      summary: Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              simple:
                $ref: '#/components/examples/deal_id_list_update_simple'
              full:
                $ref: '#/components/examples/deal_id_list_update_full'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_id_put
    delete:
      summary: Destroy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_id_delete
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids:
    get:
      summary: Index
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: ref/schemas.yaml#/components/schemas/ListResponse
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_get
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids/bulk_create:
    post:
      summary: Bulk Create
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              single:
                $ref: '#/components/examples/deal_id_list_deal_ids_bulk_create_single'
              multiple:
                $ref: '#/components/examples/deal_id_list_deal_ids_bulk_create_multiple'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_bulk_create_post
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids/bulk_delete:
    delete:
      summary: Bulk Delete
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_bulk_delete_delete
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids/bulk_replace:
    post:
      summary: Bulk Replace
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              single:
                $ref: '#/components/examples/deal_id_list_deal_ids_bulk_replace_single'
              multiple:
                $ref: '#/components/examples/deal_id_list_deal_ids_bulk_replace_multiple'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_bulk_replace_post
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids/file_bulk_create:
    post:
      summary: File Bulk Create
      description: Append deal IDs to a list from a CSV file
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - csv_file
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file containing deal IDs to append
        required: true
      responses:
        '201':
          description: Append confirmation
          content:
            application/json:
              schema:
                type: object
              example:
                created: true
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_file_bulk_create_post
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids/file_bulk_delete:
    delete:
      summary: File Bulk Delete
      description: Remove deal IDs specified in a CSV file from the list
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - csv_file
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file containing deal IDs to remove
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                type: object
              example:
                deleted: true
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_file_bulk_delete_delete
  /api/v0/deal_id_lists/{deal_id_list_id}/deal_ids/file_bulk_replace:
    post:
      summary: File Bulk Replace
      description: Replace all deal IDs in a list with contents of a CSV file
      parameters:
      - name: deal_id_list_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - csv_file
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file containing deal IDs to replace existing list
        required: true
      responses:
        '200':
          description: Replacement confirmation
          content:
            application/json:
              schema:
                type: object
              example:
                created: true
      tags:
      - Deal Id Lists
      operationId: deal_id_lists_deal_id_list_id_deal_ids_file_bulk_replace_post
components:
  examples:
    deal_id_list_deal_ids_bulk_create_single:
      summary: Single
      value:
        deal_ids:
        - deal-abc-123
    deal_id_list_update_full:
      summary: Full
      value:
        name: Deal ID List Name
        description: Deal ID list description
        active: true
    deal_id_list_create_full:
      summary: Full
      value:
        name: Deal ID List Name
        description: Deal ID list description
        active: true
    deal_id_list_deal_ids_bulk_replace_multiple:
      summary: Multiple
      value:
        deal_ids:
        - deal-abc-123
        - deal-xyz-456
        - deal-def-789
    deal_id_list_deal_ids_bulk_replace_single:
      summary: Single
      value:
        deal_ids:
        - deal-abc-123
    deal_id_list_update_simple:
      summary: Simple
      value:
        name: Deal ID List Name
    deal_id_list_deal_ids_bulk_create_multiple:
      summary: Multiple
      value:
        deal_ids:
        - deal-abc-123
        - deal-xyz-456
        - deal-def-789
    deal_id_list_create_simple:
      summary: Simple
      value:
        name: Deal ID List Name
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
