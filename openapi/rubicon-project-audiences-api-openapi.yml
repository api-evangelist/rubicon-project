openapi: 3.2.0
info:
  title: SpringServe UI Audiences API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Audiences
paths:
  /api/v1/audiences/targeted:
    get:
      summary: Get paginated list of active targeted audiences
      description: Returns audiences that have active targeting associations
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/sortParam
      - $ref: ref/params.yaml#/components/parameters/searchParam
      - $ref: ref/params.yaml#/components/parameters/filterParams
      - name: targeter_type
        in: query
        description: 'Type of targeter. Must be provided together with `targeter_id`.

          Currently only `DemandTag` is supported.

          '
        required: false
        schema:
          type: string
          enum:
          - DemandTag
      - name: targeter_id
        in: query
        description: 'ID of the targeter. Must be provided together with `targeter_type`.

          '
        required: false
        schema:
          type: integer
      - name: maui_id
        in: query
        description: Equality filter on the audience MAUI ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Audiences
      operationId: audiences_targeted_get
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
