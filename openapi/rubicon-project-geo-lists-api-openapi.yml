openapi: 3.2.0
info:
  title: SpringServe UI Geo Lists API
  version: 1.0.0
  description: '> **_NOTE:_** This document covers the v1 API (`/api/v1`).'
security:
- api_key: []
- bearer_token: []
tags:
- name: Geo Lists
paths:
  /api/v1/geo_lists:
    get:
      summary: Index
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/sortParam
      - $ref: ref/params.yaml#/components/parameters/searchParam
      - $ref: ref/params.yaml#/components/parameters/filterParams
      - $ref: ref/params.yaml#/components/parameters/includeParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/GeoList'
      tags:
      - Geo Lists
      operationId: geo_lists_get
  /api/v1/geo_lists/bulk_update:
    post:
      summary: Bulk Update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - object_ids
              properties:
                object_ids:
                  type: array
                  items:
                    type: integer
                active:
                  type: boolean
            examples:
              single:
                $ref: '#/components/examples/geo_list_bulk_update_single'
              multiple:
                $ref: '#/components/examples/geo_list_bulk_update_multiple'
        required: true
      responses:
        '200':
          description: Bulk update completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Status message describing the bulk update results
                examples:
                - message: 'Successfully updated 2 Geo Lists: 2, 3'
      tags:
      - Geo Lists
      operationId: geo_lists_bulk_update_same_attributes_post
  /api/v1/geo_lists/permissions:
    get:
      summary: Collection Permissions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Geo Lists
      operationId: geo_lists_permissions_get
  /api/v1/geo_lists/{id}/permissions:
    get:
      summary: Permissions Member
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Geo Lists
      operationId: geo_lists_id_permissions_get
components:
  examples:
    geo_list_bulk_update_single:
      summary: Single
      value:
        object_ids:
        - 1
        active: true
    geo_list_bulk_update_multiple:
      summary: Multiple
      value:
        object_ids:
        - 1
        - 2
        active: false
  schemas:
    GeoList:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
        description:
          type: string
        active:
          type: boolean
        account_id:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
