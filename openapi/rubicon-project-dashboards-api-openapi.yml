  /api/v1/dashboards/tag_performance:
    get:
      summary: Tag Performance
      parameters:
      - name: date_range
        in: query
        schema:
          $ref: ./ref/reports.yaml#/components/schemas/dateRange
      - name: forecast_date_range
        in: query
        schema:
          type: string
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - minute
          - fiveMinute
          - hour
          - day
          - comparison
          default: all
      - name: tag_type
        in: query
        schema:
          type: string
          enum:
          - demand
          - supply
          default: demand
      - name: currency
        in: query
        schema:
          $ref: ./ref/concerns/currency.yaml#/components/schemas/CurrencyList
        required: false
      - name: id
        in: query
        schema:
          type: string
        required: true
      responses:
