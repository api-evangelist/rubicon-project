info:
  title: Rubicon Project Metro Area Lists API
  version: '1.0'
  description: 'Operations tagged Metro Area Lists across 2 of this provider''s published API definitions: rubicon-project-springserve-v0-openapi.yml, rubicon-project-springserve-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
