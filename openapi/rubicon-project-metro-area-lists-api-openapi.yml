    servers:
    - url: https://console.springserve.com/api/v1
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/metro_area_lists/{id}/permissions:
    get:
      summary: Permissions Member
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Metro Area Lists
      operationId: metro_area_lists_id_permissions_get
    servers:
    - url: https://console.springserve.com/api/v1
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
components:
  examples:
    metro_area_list_create_simple:
      summary: Simple
      value:
        name: Metro Area List Name
        metro_area_codes:
        - 2001
    metro_area_list_update_full:
      summary: Full
      value:
        name: Metro Area List Name
        description: Metro Area List Description
        active: true
        metro_area_codes:
        - 2001
    metro_area_list_update_simple:
      summary: Simple
      value:
        name: Metro Area List Name
    metro_area_list_create_full:
      summary: Full
      value:
        name: Metro Area List Name
        description: Metro Area List Description
        metro_area_codes:
        - 2001
        active: true
    metro_area_list_update_full_2:
      summary: Full
      value:
        name: Metro Area List Name
        description: Metro Area List Description
        active: true
        list_action: append
        metro_area_codes:
        - 2001
  schemas:
    MetroAreaListUpdateRequest:
      type: object
      properties:
        name:
          type: string
          examples:
          - Update Metro Area List Name
        description:
          type: string
          examples:
          - Update Metro Area List Description
        active:
          type: boolean
          examples:
          - true
        list_action:
          type: string
          enum:
          - append
          - replace
          - remove
          examples:
          - append
    MetroAreaListCreateRequest:
      type: object
      properties:
        name:
          type: string
          examples:
          - Metro Area List Name
        description:
          type: string
          examples:
          - Metro Area List Description
        active:
          type: boolean
          examples:
          - true
      required:
      - name
    MetroAreaListResponse:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metro_area_codes:
          type: array
          items:
            type: number
    MetroAreaListErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: General error message
          examples:
          - Metro Area codes can't be blank
        errors:
          type: object
          description: Detailed validation errors by field
          additionalProperties:
            type: array
            items:
              type: string
          examples:
          - metro_area_codes:
            - can't be blank
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: SpringServe authorization token based authentication.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SpringServe authorization bearer token based authentication.  This key is included in the response from the /api/v0/auth and /api/v1/auth endpoints.  This key will be automatically set if you run the example for /api/v0/auth or /api/v1/auth
