    - url: https://console.clearline.magnite.com/api/v0
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/metro_area_lists:
    get:
      summary: Index
      parameters:
      - $ref: ref/params.yaml#/components/parameters/pageParam
      - $ref: ref/params.yaml#/components/parameters/perParam
      - $ref: ref/params.yaml#/components/parameters/sortParam
      - $ref: ref/params.yaml#/components/parameters/searchParam
      - $ref: ref/params.yaml#/components/parameters/filterParams
      - $ref: ref/params.yaml#/components/parameters/includeParam
      - $ref: ref/params.yaml#/components/parameters/idsParam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Metro Area Lists
      operationId: metro_area_lists_get
    post:
      summary: Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/MetroAreaListCreateRequest'
              - type: object
                properties:
                  metro_area_codes:
                    type: array
                    items:
                      type: number
                    examples:
                    - - 2008
                      - 2028
                      - 2038
                required:
                - metro_area_codes
            examples:
              simple:
                $ref: '#/components/examples/metro_area_list_create_simple'
              full:
                $ref: '#/components/examples/metro_area_list_create_full'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/MetroAreaListCreateRequest'
              - type: object
                properties:
                  csv_file:
                    type: string
                    format: binary
                required:
                - csv_file
      responses:
        '201':
          description: Successfully created Metro Area List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetroAreaListResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetroAreaListErrorResponse'
      tags:
      - Metro Area Lists
      operationId: metro_area_lists_post
    servers:
    - url: https://console.springserve.com/api/v1
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/metro_area_lists/{id}:
    get:
      summary: Show
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Metro Area Lists
      operationId: metro_area_lists_id_get
    patch:
      summary: Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/MetroAreaListUpdateRequest'
              - type: object
                properties:
                  metro_area_codes:
                    type: array
                    items:
                      type: number
                    description: List of metro area (Comscore Market) IDs. Can be used only when the list_action parameter is provided.
                    examples:
                    - - 2008
                      - 2028
                      - 2038
            examples:
              simple:
                $ref: '#/components/examples/metro_area_list_update_simple'
              full:
                $ref: '#/components/examples/metro_area_list_update_full_2'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/MetroAreaListUpdateRequest'
              - type: object
                properties:
                  csv_file:
                    type: string
                    format: binary
                    description: CSV file with metro area IDs. Can be used only when the list_action parameter is provided.
      responses:
        '200':
          description: Updated Metro Area List successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetroAreaListResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetroAreaListErrorResponse'
      tags:
      - Metro Area Lists
      operationId: metro_area_lists_id_patch
    delete:
      summary: Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
      tags:
      - Metro Area Lists
      operationId: metro_area_lists_id_delete
    servers:
    - url: https://console.springserve.com/api/v1
      description: SpringServe console. Added by API Evangelist from the published documentation (springserve.atlassian.net/wiki/spaces/SSD/pages/1573617663/API+-+Getting+Started, "Base Url https://console.springserve.com/"); the document Magnite serves declares no servers[] block because the Swagger UI infers the host from window.location.
    - url: https://console.clearline.magnite.com/api/v1
      description: ClearLine console. The identical contract is served from ClearLine's own host; base URL published at springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK.
  /api/v1/metro_area_lists/permissions:
