changelog:
  release_notes_published: false
  note: >-
    Magnite's "Product Release Notes" section on help.magnite.com is login-gated, and the
    anonymous help center answers every /help/<slug> path with the same 122,137-byte
    landing page. The pages named "Changelog" in the public Confluence space document a
    product FEATURE — a per-account audit log of who changed which tag, readable via the
    Changelogs API (changelogs_get) — not an API release changelog. No dated public
    changelog exists, so no changelog/ artifact and no ChangeLog pointer are emitted.
  product_feature:
    tag: Changelogs
    operations:
