auth:
  scheme: bearer or opaque token in Authorization header
  obtain: POST /api/v1/auth with email + password (application/x-www-form-urlencoded)
  ttl: 2h
  account_context_header: x-auth-context
  note: An MCP server would have to re-authenticate every two hours and would hold a human user's console
    password. There is no OAuth flow and no scoped credential, so an MCP tool would run with the full
    rights of that user — a material design constraint for anyone building this.
