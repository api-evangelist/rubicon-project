constraints:
- Account-wide cap of 240 requests/minute; reporting capped at 10/minute and 3/minute by domain or app
  bundle. No rate-limit response headers and no 429 declared, so a server must budget requests itself
  rather than react to signals.
- No idempotency keys, so a write tool cannot safely retry a timed-out POST.
- Errors carry no machine-readable code, only English strings, so tool error handling must string-match.
- Bulk endpoints report "All updates failed - no objects were updated successfully" on total failure,
  but partial-success semantics for mixed batches are not documented.
