- aid: rubicon-project-clearline-api
  name: ClearLine API
  description: >-
    ClearLine is Magnite's direct buy-side activation platform for advertisers and agencies,
    running on the same SpringServe codebase and serving the identical OpenAPI 3.1.2 contract
    from its own console host. The ClearLine documentation space documents the same v1/v0
    endpoints under the ClearLine base URL, plus ClearLine-specific surfaces including
    budgets, bid modifiers, delivery modifiers, segment targeting and deals.
  humanURL: https://springserve.atlassian.net/wiki/spaces/CLD/pages/3649929217/Clearline+API+SDK
