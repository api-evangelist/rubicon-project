  description: >-
    The original v0 REST API for SpringServe, still fully supported and documented alongside
    v1 while Magnite builds v1 equivalents for every endpoint. 289 operations across 173
    paths covering campaigns, supply and demand tags, connected supply and connected demand,
    direct connections and clearing terms, segments and partner segments, creatives, bid
    maps, key-values, forecasting and reporting. Published as OpenAPI 3.1.2 and served
