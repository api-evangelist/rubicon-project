apis:
- aid: rubicon-project-springserve-v1-api
  name: SpringServe UI API (v1)
  description: >-
    The v1 REST API for SpringServe, Magnite's ad-serving and CTV/streaming ad-server
    platform. 379 operations across 295 paths and 53 tags, covering supply tags, demand
    tags, supply routers, creatives (video, audio, tag, tile), deals and curated
    marketplaces, audiences and partner segments, targeting lists (domain, app bundle, app
    name, geo, ISP, postal code, city, state, country, metro area), header bidding
    platforms and bid maps, dashboards, reporting, report templates and scheduled reports,
    changelogs, notifications, permissions, users, accounts and billing. Published as
    OpenAPI 3.1.2 and served anonymously from the SpringServe console's Swagger UI. Magnite
    is still building v1 parity with v0, so both versions are live and documented side by
    side.
  humanURL: https://springserve.atlassian.net/wiki/spaces/SSD/pages/1584726013/SpringServe+API+SDK
