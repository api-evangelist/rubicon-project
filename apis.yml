  name: Magnite Exchange API (xAPI) OpenRTB Extensions
  description: >-
    Magnite's Exchange API (xAPI) protobuf extensions to the IAB OpenRTB 2.x protobuf definitions, published
    in the open on GitHub. Defines Magnite-specific OpenRTB extension fields (extension IDs in the 5100-5299
    range) for the AdEngine bidding endpoint, including window/iframe geometry, key-value pairs and supply-chain
    signals used by demand partners bidding into the Magnite exchange.
