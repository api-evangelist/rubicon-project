name: Rubicon Project
description: >-
  Rubicon Project is a Los Angeles-based advertising technology company, founded in 2007,
  that built and operated one of the largest real-time bidding advertising exchanges,
  connecting digital publishers (the sell side) with advertisers and demand-side platforms.
  In 2020 Rubicon Project merged with Telaria and rebranded as Magnite, now positioned as
  the world's largest independent sell-side (SSP) advertising company, spanning connected TV
  (CTV), online video, display, and audio across its DV+, SpringServe, ClearLine and Magnite
  Streaming platforms. This profile tracks the company as it exists today under the Magnite
  brand. Magnite publishes a public, machine-readable OpenAPI 3.1 contract for the SpringServe
  ad-serving platform (v1 and v0) at console.springserve.com/api-docs, mirrored for the
  ClearLine buy-side console at console.clearline.magnite.com, together with a public
  Confluence documentation space, published rate limits, a first-party Python SDK, mobile
  In-App Ads SDKs for iOS and Android, and OpenRTB protobuf extensions. Account creation and
  API credentials remain partner-gated; the contract itself is anonymously readable.
