note: >-
  Magnite publishes no plans, tiers, list prices or rate card of any kind. www.magnite.com
  has no /pricing page (probed, HTTP 404) and none of the 97 URLs Magnite lists in its own
  llms.txt is a pricing page — the site routes buyers and sellers to "Contact Us" and an
  account team. This is expected for a sell-side ad platform: Magnite's commercial model is
  a negotiated revenue share / take rate on media transacted through the exchange, and the
  API is a control surface bundled with a platform contract rather than a metered product.
  Access to the SpringServe / ClearLine API requires a console account, which requires a
  signed platform agreement; API credentials are then created self-service inside that
  account (Settings -> Users). The contract itself is anonymously readable at
  console.springserve.com/api-docs — the SPEC is public, the ACCESS is not.
